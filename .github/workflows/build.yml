name: Build LEDE NewifiD2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone LEDE
        run: |
          git clone https://github.com/coolsnowwolf/lede.git ./lede-src
          cd ./lede-src
          git checkout master

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison git gettext libssl-dev python3 python3-pip unzip libz-dev device-tree-compiler

      - name: Set Config
        run: |
          cd $GITHUB_WORKSPACE/lede-src
          make distclean
          rm -rf .config*
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_PROFILE_DEVICE_d-team_newifi-d2=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_zerotier=y" >> .config
          echo "CONFIG_PACKAGE_lean-default-settings=n" >> .config
          make defconfig
          grep CONFIG_TARGET .config

      - name: Patch DTS
        run: |
          cd $GITHUB_WORKSPACE/lede-src
          sed -i 's/reg = <0x50000 0x1b00000>/reg = <0x50000 0x3b00000>/' target/linux/ramips/dts/mt7621_d-team_newifi-d2.dts

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE/lede-src
          make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: NewifiD2-FW
          path: ./lede-src/bin/targets/ramips/mt7621/*.bin
