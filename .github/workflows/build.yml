name: Build LEDE NewifiD2
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison git gettext libssl-dev xsltproc rsync wget unzip python3 python3-pip python3-setuptools python3-dev ccache libelf-dev

      - name: Generate config
        run: |
          make defconfig PROFILE=newifi_y1s
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=58" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7603=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7612e=y" >> .config
          make defconfig

      - name: Compile firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: lede-newifi-d2
          path: bin/targets/ramips/mt7621/
