name: Build ImmortalWrt NewifiD2 64M
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-dev rsync unzip wget zlib1g-dev

      - name: Modify DTS partition size
        run: |
          cd $GITHUB_WORKSPACE
          DTS_FILE=target/linux/ramips/dts/mt7621_d-team_newifi-d2.dts
          echo "DTS文件: $DTS_FILE"
          # 替换root分区长度 0x1b00000 → 0x3b00000
          sed -i 's/0x1b00000/0x3b00000/' $DTS_FILE
          echo "✅ DTS修改完成"

      - name: Generate .config
        run: |
          cd $GITHUB_WORKSPACE
          make defconfig
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_D_TEAM_NEWIFI_D2=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-zerotier=y" >> .config
          make olddefconfig

      - name: Compile firmware
        run: |
          cd $GITHUB_WORKSPACE
          make -j$(nproc)

      - name: Upload firmware bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/ramips/mt7621/*.bin
