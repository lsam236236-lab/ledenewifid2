name: Build ImmortalWrt NewifiD2 64M
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-dev rsync unzip wget zlib1g-dev

      - name: Modify DTS Newifi D2 64M Flash
        run: |
          echo '/dts-v1/;' > target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '#include <dt-bindings/gpio/gpio.h>' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '#include <dt-bindings/input/input.h>' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '/ {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	compatible = "newifi,d2", "mediatek,mt7621";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	model = "Newifi D2";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	aliases {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		led-boot = &led_power;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		led-failsafe = &led_power;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		led-running = &led_power;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		led-upgrade = &led_power;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		serial0 = &uart0;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	chosen {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		bootargs = "console=ttyS0,57600";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	keys {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		compatible = "gpio-keys";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		reset {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			label = "reset";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			gpios = <&gpio0 18 GPIO_ACTIVE_LOW>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			linux,code = <KEY_RESTART>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	leds {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		compatible = "gpio-leds";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		led_power: power {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			label = "white:power";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			gpios = <&gpio0 1 GPIO_ACTIVE_LOW>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '&spi0 {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	status = "okay";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	flash@0 {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		compatible = "w25q64","jedec,spi-nor";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		reg = <0>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		spi-max-frequency = <40000000>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		partitions {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			compatible = "fixed-partitions";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			#address-cells = <1>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			#size-cells = <1>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			partition@0 {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '				label = "u-boot";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '				reg = <0x000000 0x030000>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '				read-only;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			partition@30000 {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '				label = "u-boot-env";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '				reg = <0x030000 0x010000>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			partition@40000 {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '				label = "factory";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '				reg = <0x040000 0x010000>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '				read-only;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			partition@50000 {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '				label = "firmware";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '				reg = <0x050000 0x3b00000>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '			};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '		};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '&uart0 {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	status = "okay";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '&pcie {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	status = "okay";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '&eth {' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	status = "okay";' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '	mediatek,portmap = <0x3e>;' >> target/linux/ramips/dts/mt7621_newifi-d2.dts
          echo '};' >> target/linux/ramips/dts/mt7621_newifi-d2.dts

      - name: Add plugins (ZeroTier + OpenClash)
        run: |
          git clone https://github.com/immortalwrt/packages.git package/immortalwrt-packages
          git clone https://github.com/moonshotyu/luci-app-openclash.git package/luci-app-openclash

      - name: Generate .config
        run: |
          make defconfig
          sed -i 's/CONFIG_TARGET_ramips_mt7621_NEWIFI_D2=n/CONFIG_TARGET_ramips_mt7621_NEWIFI_D2=y/' .config
          echo "CONFIG_PACKAGE_luci-app-zerotier=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          make olddefconfig

      - name: Build firmware
        run: |
          make -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/ramips/mt7621/*.bin
