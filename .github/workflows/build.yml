name: Build ImmortalWrt NewifiD2-64M
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-dev rsync unzip wget zlib1g-dev

      - name: Modify DTS newifi-d2.dts 单firmware大分区
        run: |
          DTS_FILE=target/linux/ramips/dts/newifi-d2.dts
          sed -i '/partitions {/,/};/d' $DTS_FILE
          sed -i '/\t\tcompatible = "spi-flash";/a\
        partitions {\
          partition@0 {\
            label = "u-boot";\
            reg = <0x000000 0x300000>;\
          };\
          partition@300000 {\
            label = "u-boot-env";\
            reg = <0x300000 0x100000>;\
          };\
          partition@400000 {\
            label = "factory";\
            reg = <0x400000 0x100000>;\
            read-only;\
          };\
          partition@500000 {\
            label = "firmware";\
            reg = <0x500000 0x1fb0000>;\
          };\
        };' $DTS_FILE
          cat $DTS_FILE

      - name: Config
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_newifi-d2=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_luci-mod-admin-full=y" >> .config
          echo "CONFIG_PACKAGE_uhttpd=y" >> .config
          echo "CONFIG_PACKAGE_opkg=y" >> .config
          echo "CONFIG_PACKAGE_zerotier=y" >> .config
          echo "CONFIG_PACKAGE_e2fsprogs=y" >> .config
          make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc)

      - name: List compiled firmware files
        run: |
          find ./bin -name "*.bin"
          ls -la bin/targets/ramips/mt7621/ || echo "Folder not found"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewifiD2-64M-ImmortalWrt
          path: bin/targets/ramips/mt7621/*.bin
