name: Build ImmortalWrt NewifiD2 64M
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-dev rsync unzip wget zlib1g-dev

      - name: Modify DTS partition size
        run: |
          cd $GITHUB_WORKSPACE
          DTS_FILE=$(find target/linux/ramips/dts -name "*newifi*d2*.dts")
          echo "DTS路径: $DTS_FILE"
          cat $DTS_FILE | grep "reg = <0x050000"
          sed -i 's/reg = <0x050000 0x1b00000>/reg = <0x050000 0x3b00000>/' $DTS_FILE
          echo "修改后分区信息："
          cat $DTS_FILE | grep "reg = <0x050000"

      - name: Generate .config
        run: |
          cd $GITHUB_WORKSPACE
          make defconfig
          # 打印当前TARGET配置，排查设备名
          grep "CONFIG_TARGET" .config | head -20
          # 直接用make menuconfig的命令行配置，代替sed修改，更稳定
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_NEWIFI_D2=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-zerotier=y" >> .config
          make olddefconfig

      - name: Compile firmware
        run: |
          cd $GITHUB_WORKSPACE
          make -j$(nproc)

      - name: Upload firmware bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/ramips/mt7621/*.bin
