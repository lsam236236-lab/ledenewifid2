name: Build ImmortalWrt NewifiD2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison git gettext libssl-dev python3 python3-pip unzip

      - name: Create .config
        run: |
          cd $GITHUB_WORKSPACE
          echo "CONFIG_TARGET=ramips" > .config
          echo "CONFIG_TARGET_SUBTARGET=mt7621" >> .config
          echo "CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_d-team_newifi-d2=y" >> .config
          echo "# CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_adslr_g7 is not set" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_zerotier=y" >> .config
          make defconfig || true
          grep -E "CONFIG_TARGET_DEVICE.*newifi|CONFIG_TARGET_DEVICE.*adslr" .config

      - name: Build firmware
        run: |
          cd $GITHUB_WORKSPACE
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/ramips/mt7621/*.bin
