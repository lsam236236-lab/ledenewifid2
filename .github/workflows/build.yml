name: Build ImmortalWrt NewifiD2
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-24.10
          depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison git gettext libssl-dev xsltproc rsync wget unzip python3 python3-pip python3-setuptools python3-dev ccache libelf-dev

      - name: Update & Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config (Newifi D2 d-team_newifi-d2)
        run: |
          make defconfig
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_d-team_newifi-d2=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=64" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-zerotier=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7603=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7612e=y" >> .config
          make oldconfig

      - name: Download all source packages
        run: |
          make download -j1

      - name: Compile firmware
        continue-on-error: true
        run: |
          make -j1 V=s 2>&1 | tee build-log.txt

      - name: Show compiled files
        run: |
          ls -la
          ls -la bin/ || echo "bin文件夹不存在"
          find . -name "*.bin"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: build-log.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-newifi-d2-firmware
          path: bin/targets/ramips/mt7621/
          if-no-files-found: error
