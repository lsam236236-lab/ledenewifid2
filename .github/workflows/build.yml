name: Build ImmortalWrt NewifiD2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          fetch-depth: 1

      - name: Install full build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison git gettext libssl-dev python3 python3-pip unzip \
          libpam-dev libtirpc-dev liblzma-dev libzstd-dev libsnmp-dev libglib2.0-dev libgpiod-dev libev-dev lm-sensors

      - name: Write .config manually
        run: |
          cd $GITHUB_WORKSPACE
          cat > .config <<'EOF'
CONFIG_TARGET=ramips
CONFIG_TARGET_SUBTARGET=mt7621
CONFIG_TARGET_PROFILE="DEVICE_d-team_newifi-d2"
CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_d-team_newifi-d2=y
# CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_adslr_g7 is not set
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-base=y
CONFIG_PACKAGE_zerotier=y
EOF
          # 校验配置
          grep -E "CONFIG_TARGET_PROFILE|CONFIG_TARGET_DEVICE.*newifi" .config

      - name: Build firmware
        run: |
          cd $GITHUB_WORKSPACE
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/ramips/mt7621/*.bin
