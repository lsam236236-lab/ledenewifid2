name: Build Lede Newifi-D2
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Prepare env & add plugins
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev git python3 python3-pip unzip curl rsync wget
          # 浅克隆 OpenClash，失败自动重试
          for i in 1 2 3; do git clone --depth=1 https://github.com/vernesong/OpenClash.git package/luci-app-openclash && break; rm -rf package/luci-app-openclash; sleep 10; done
          # 浅克隆 ZeroTier，失败自动重试
          for i in 1 2 3; do git clone --depth=1 https://github.com/rufengsuixing/luci-app-zerotier.git package/luci-app-zerotier && break; rm -rf package/luci-app-zerotier; sleep 10; done
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_newifi_d2=y

          CONFIG_TARGET_ROOTFS_PARTSIZE=58
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-i18n-zh-cn=y

          # OpenClash
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_jsonfilter=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq=n

          # ZeroTier
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_luci-app-zerotier=y

          # SQM
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y

          # wifi驱动
          CONFIG_PACKAGE_kmod-mt7603=y
          CONFIG_PACKAGE_kmod-mt7612e=y
          CONFIG_PACKAGE_wireless-regdb=y

          # 工具
          CONFIG_PACKAGE_opkg=y
          CONFIG_PACKAGE_ssh=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_iperf3=y
          EOF
          make defconfig

      - name: Compile firmware
        run: |
          make -j1 V=s

      - name: Upload bin
        uses: actions/upload-artifact@v4
        with:
          name: Newifi-D2-Firmware
          path: bin/targets/ramips/mt7621/*.bin
