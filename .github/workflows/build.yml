name: Build LEDE NewifiD2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LEDE source
        uses: actions/checkout@v4
        with:
          repository: coolsnowwolf/lede
          ref: master
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison git gettext libssl-dev python3 python3-pip unzip libpam-dev libtirpc-dev liblzma-dev libzstd-dev libsnmp-dev libglib2.0-dev libgpiod-dev libev-dev lm-sensors device-tree-compiler

      - name: Clean old config and set target to Newifi D2
        run: |
          cd $GITHUB_WORKSPACE
          export TERM=dumb
          make distclean || true
          rm -rf .config .config.old build_dir bin tmp staging_dir

          # 直接设置平台 ramips mt7621 Newifi D2
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_PROFILE=\"DEVICE_d-team_newifi-d2\"" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_zerotier=y" >> .config

          make defconfig
          grep -E "CONFIG_TARGET|CONFIG_TARGET_PROFILE" .config

      - name: Patch DTS 扩容 root分区到60M
        run: |
          cd $GITHUB_WORKSPACE
          # 修改Newifi D2 dts，64M闪存：kernel 4M，rootfs 60M
          sed -i 's/reg = <0x50000 0x1b00000>/reg = <0x50000 0x3b00000>/' target/linux/ramips/dts/mt7621_d-team_newifi-d2.dts
          cat target/linux/ramips/dts/mt7621_d-team_newifi-d2.dts | grep -A10 -B10 "partition@50000"

      - name: Build firmware
        run: |
          cd $GITHUB_WORKSPACE
          export TERM=dumb
          make -j$(nproc)

          echo "=== Search firmware ==="
          find ./bin -name "*newifi*d2*.bin"
          ls -la ./bin/targets/ramips/mt7621/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            ./bin/targets/ramips/mt7621/*.bin
