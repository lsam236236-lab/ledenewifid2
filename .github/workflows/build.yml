name: Build LEDE NewifiD2 Only
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone LEDE source
        run: |
          git clone https://github.com/coolsnowwolf/lede.git ./lede-src
          cd ./lede-src
          git checkout master

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison git gettext libssl-dev python3 python3-pip unzip libz-dev device-tree-compiler

      - name: Config & Lock target to Newifi D2
        run: |
          cd $GITHUB_WORKSPACE/lede-src
          make distclean
          rm -rf .config*

          # 写入配置，强制锁定 ramips mt7621 Newifi D2
          cat > .config <<EOF
CONFIG_TARGET_ramips=y
CONFIG_TARGET_ramips_mt7621=y
CONFIG_TARGET_PROFILE_DEVICE_d-team_newifi-d2=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-base=y
CONFIG_PACKAGE_zerotier=y
EOF
          make defconfig
          # 打印确认目标
          grep -E "CONFIG_TARGET|CONFIG_TARGET_PROFILE" .config

      - name: Patch DTS 扩容 root 60M
        run: |
          cd $GITHUB_WORKSPACE/lede-src
          sed -i 's/reg = <0x50000 0x1b00000>/reg = <0x50000 0x3b00000>/' target/linux/ramips/dts/mt7621_d-team_newifi-d2.dts

      - name: Compile firmware
        run: |
          cd $GITHUB_WORKSPACE/lede-src
          make -j$(nproc)

      - name: Upload only Newifi D2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: NewifiD2-Firmware
          path: ./lede-src/bin/targets/ramips/mt7621/*.bin
