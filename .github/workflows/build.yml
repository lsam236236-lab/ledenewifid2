name: Build ImmortalWrt NewifiD2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-dev rsync unzip wget zlib1g-dev

      - name: Create brand new .config for Newifi D2
        run: |
          cd $GITHUB_WORKSPACE
          rm -f .config
          # Target 基础平台
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          # 只选中 Newifi D2，关闭同平台其他所有设备
          echo "CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_d-team_newifi-d2=y" >> .config
          echo "# CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_adslr_g7 is not set" >> .config
          # 基础系统
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-zerotier=y" >> .config
          make defconfig

      - name: Build firmware
        run: |
          cd $GITHUB_WORKSPACE
          make -j$(nproc)

      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: newifi-d2-firmware
          path: bin/targets/ramips/mt7621/*.bin
