name: Build ImmortalWrt NewifiD2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone ImmortalWrt
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git ./src
          cd ./src
          git checkout master

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison git gettext libssl-dev python3 python3-pip unzip libz-dev device-tree-compiler

      - name: Config & Select Newifi D2
        run: |
          cd $GITHUB_WORKSPACE/src
          make distclean
          rm -rf .config
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_d-team_newifi-d2=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_zerotier=y" >> .config
          make defconfig

      - name: Patch DTS for 64M flash root 60M
        run: |
          cd $GITHUB_WORKSPACE/src
          sed -i 's/reg = <0x50000 0x1b00000>/reg = <0x50000 0x3b00000>/' target/linux/ramips/dts/mt7621_d-team_newifi-d2.dts

      - name: Compile
        run: |
          cd $GITHUB_WORKSPACE/src
          make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: NewifiD2-ImmortalWrt
          path: ./src/bin/targets/ramips/mt7621/immortalwrt-ramips-mt7621-d-team_newifi-d2-*.bin
