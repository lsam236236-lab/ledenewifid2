name: Build ImmortalWrt NewifiD2-64M
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-dev rsync unzip wget zlib1g-dev

      - name: Feeds update & install（仅加载必要feed，排除video）
        run: |
          ./scripts/feeds update base packages luci
          ./scripts/feeds install base packages luci

      - name: Generate default config and customize
        run: |
          # 生成基础默认配置
          make defconfig
          # 目标：ramips mt7621 newifi-d2
          sed -i 's/# CONFIG_TARGET_ramips is not set/CONFIG_TARGET_ramips=y/' .config
          sed -i 's/# CONFIG_TARGET_ramips_mt7621 is not set/CONFIG_TARGET_ramips_mt7621=y/' .config
          sed -i 's/# CONFIG_TARGET_ramips_mt7621_DEVICE_newifi-d2 is not set/CONFIG_TARGET_ramips_mt7621_DEVICE_newifi-d2=y/' .config
          # 设置rootfs分区大小60MB
          sed -i 's/.*CONFIG_TARGET_ROOTFS_PARTSIZE.*/CONFIG_TARGET_ROOTFS_PARTSIZE=60/' .config
          # 开启需要软件包
          sed -i 's/# CONFIG_PACKAGE_luci is not set/CONFIG_PACKAGE_luci=y/' .config
          sed -i 's/# CONFIG_PACKAGE_luci-mod-admin-full is not set/CONFIG_PACKAGE_luci-mod-admin-full=y/' .config
          sed -i 's/# CONFIG_PACKAGE_zerotier is not set/CONFIG_PACKAGE_zerotier=y/' .config
          sed -i 's/# CONFIG_PACKAGE_e2fsprogs is not set/CONFIG_PACKAGE_e2fsprogs=y/' .config
          # 应用配置，清理无效选项
          make olddefconfig

      - name: Build firmware
        run: |
          make -j$(nproc)

      - name: List compiled firmware files
        run: |
          find ./bin -name "*.bin"
          ls -la bin/targets/ramips/mt7621/ || echo "Folder not found"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewifiD2-64M-ImmortalWrt
          path: bin/targets/ramips/mt7621/*.bin
