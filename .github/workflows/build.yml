name: Build ImmortalWrt NewifiD2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          fetch-depth: 1

      - name: Install full build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison git gettext libssl-dev python3 python3-pip unzip libpam-dev libtirpc-dev liblzma-dev libzstd-dev libsnmp-dev libglib2.0-dev libgpiod-dev libev-dev lm-sensors

      - name: Create config (non-interactive, mt7621 Newifi D2)
        run: |
          cd $GITHUB_WORKSPACE
          export TERM=dumb
          # 清空旧配置，强制设置ramips mt7621
          rm -f .config
          echo "CONFIG_TARGET=ramips" > .config
          echo "CONFIG_TARGET_SUBTARGET=mt7621" >> .config
          echo "CONFIG_TARGET_PROFILE=\"DEVICE_d-team_newifi-d2\"" >> .config
          echo "CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_d-team_newifi-d2=y" >> .config
          echo "# CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_adslr_g7 is not set" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_zerotier=y" >> .config
          make defconfig || true
          # 打印校验，确认目标平台
          grep -E "CONFIG_TARGET|CONFIG_TARGET_PROFILE" .config

      - name: Build firmware
        run: |
          cd $GITHUB_WORKSPACE
          export TERM=dumb
          make -j$(nproc)
          # 查找固件
          find ./bin -name "*.bin"
          ls -la ./bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            ./bin/**/*.bin
