name: Build ImmortalWrt NewifiD2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          fetch-depth: 1

      - name: Install full build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison git gettext libssl-dev python3 python3-pip unzip libpam-dev libtirpc-dev liblzma-dev libzstd-dev libsnmp-dev libglib2.0-dev libgpiod-dev libev-dev lm-sensors

      - name: Force set target ramips mt7621 NewifiD2
        run: |
          cd $GITHUB_WORKSPACE
          export TERM=dumb
          rm -f .config
          # 直接用脚本设置目标，immortalwrt支持这个指令
          ./scripts/gen_config ramips mt7621 d-team_newifi-d2
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_zerotier=y" >> .config
          make defconfig || true
          # 打印校验，确认平台
          grep -E "CONFIG_TARGET|CONFIG_TARGET_PROFILE" .config

      - name: Build firmware
        run: |
          cd $GITHUB_WORKSPACE
          export TERM=dumb
          make -j$(nproc)
          find ./bin -name "*.bin"
          ls -la ./bin/targets

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            ./bin/**/*.bin
