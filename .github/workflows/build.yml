name: Build ImmortalWrt NewifiD2
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-24.10
          depth: 1

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch DTS 修改NewifiD2分区 4M kernel +60M root
        run: |
          DTS_FILE=target/linux/ramips/dts/mt7621_d-team_newifi-d2.dts
          # 修改kernel分区 4M: 0x00400000
          sed -i 's/reg = <0x00000000 0x00200000>;/reg = <0x00000000 0x00400000>;/' $DTS_FILE
          # 修改rootfs分区 60M: 0x03C00000
          sed -i 's/reg = <0x00200000 0x03A00000>;/reg = <0x00400000 0x03C00000>;/' $DTS_FILE
          cat $DTS_FILE

      - name: Generate config (Newifi D2 d-team_newifi-d2)
        run: |
          make defconfig
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_d-team_newifi-d2=y" >> .config
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=4" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=60" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-zerotier=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7603e=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7612e=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_ttyd=y" >> .config
          make defconfig

      - name: Download all source packages
        run: |
          make download -j1

      - name: Compile firmware
        continue-on-error: true
        run: |
          make -j1 V=s 2>&1 | tee build-log.txt

      - name: Show compiled files
        run: |
          ls -la
          ls -la bin/ || echo "bin文件夹不存在"
          find ./bin -type f

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-newifid2-firmware
          path: bin/targets/ramips/mt7621/
