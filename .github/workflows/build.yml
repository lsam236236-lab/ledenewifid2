name: Build ImmortalWrt NewifiD2-64M
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: master

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-dev rsync unzip wget zlib1g-dev

      - name: Feeds update & install
        run: |
          ./scripts/feeds update base packages luci
          ./scripts/feeds install base packages luci

      - name: Generate config + set rootfs size 60M
        run: |
          make clean
          make menuconfig -y <<EOF
          Target System: MediaTek Ralink MIPS
          Subtarget: MT7621
          Target Profile: Newifi D2
          Target Root filesystem partition size (MiB): 60
          LuCI -> Collections: luci
          LuCI -> Modules: luci-mod-admin-full
          Network -> ZeroTier: zerotier
          Base system: opkg
          Utilities -> e2fsprogs
          EOF
          make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc)

      - name: List compiled firmware files
        run: |
          find ./bin -name "*.bin"
          ls -la bin/targets/ramips/mt7621/ || echo "Folder not found"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewifiD2-64M-ImmortalWrt
          path: bin/targets/ramips/mt7621/*.bin
