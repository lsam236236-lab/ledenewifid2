name: Build LEDE Newifi D2
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Expand disk space
        run: |
          df -h
          sudo apt-get install -y parted
          sudo parted /dev/sda resizepart 2 100%
          sudo resize2fs /dev/sda2
          df -h

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison \
          git gettext libssl-dev xsltproc rsync wget unzip python3 python3-pip \
          python3-setuptools python3-dev ccache libelf-dev

      - name: Generate .config for Newifi D2 (newifi_y1s)
        run: |
          make defconfig PROFILE=newifi_y1s
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=58" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7603=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7612e=y" >> .config
          make defconfig
          cat .config

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lede-newifi-d2-firmware
          path: bin/targets/ramips/mt7621/
