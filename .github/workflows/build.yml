name: Build NewifiD2
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev git python3 python3-pip unzip curl rsync wget time

      - name: Write config
        run: |
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_newifi_d2=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=58" >> .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7603=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7612e=y" >> .config
          make defconfig

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewifiD2-Firmware
          path: bin/targets/ramips/mt7621/*.bin
